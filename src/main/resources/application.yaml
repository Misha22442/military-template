# Spring Application Configuration
spring:
  application:
    name: military-transport-api

  # PostgreSQL Database Configuration (Docker)
  datasource:
    url: jdbc:postgresql://localhost:5432/military_db
    username: military_user
    password: military_pass
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none  # Liquibase manages schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: false

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    ua.edu.viti.military: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
app:
  jwt:
    secret: VerySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmSecurityPurposes
    expiration-ms: 86400000  # 24 hours

# Management Endpoints (Actuator with Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true